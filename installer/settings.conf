---
# Orus OS installer. Based on calamares-settings-debian's live-to-disk
# sequence, with the license step added, and without displaymanager and
# plymouthcfg (the session starts from the console login; no display manager
# or Plymouth is installed).
# The first directory holds the welcome module that postinst makes (see
# orus-brand-welcome); it must come before Calamares' own.
modules-search: [ /usr/share/orus/installer/modules, local, /usr/lib/calamares/modules ]
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
quit-at-end: false

sequence:
- show:
  - welcome
  - license
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - luksbootkeyfile
  - dpkg-unsafe-io
  - sources-media
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - networkcfg
  - hwclock
  - services-systemd
  - bootloader-config
  - grubcfg
  - bootloader
  - packages
  - initramfscfg
  - initramfs
  - dpkg-unsafe-io-undo
  - sources-media-unmount
  - sources-final
  - umount
- show:
  - finished

branding: orus
prompt-install: false
dont-chroot: false

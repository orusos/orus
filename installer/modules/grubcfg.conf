---
# Installed system: hidden, quiet GRUB. Hold Shift (BIOS) or tap Esc (UEFI) at
# boot to get the menu. The GRUB name comes from the branding's bootloaderEntryName.
overwrite: false
# Without this the module ignores `defaults` whenever /etc/default/grub exists.
always_use_defaults: true
# GRUB_CMDLINE_LINUX_DEFAULT is built from this list, not from `defaults`.
kernel_params: ["quiet", "loglevel=3"]
defaults:
  GRUB_TIMEOUT: 0
  GRUB_TIMEOUT_STYLE: hidden

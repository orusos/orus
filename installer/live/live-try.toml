# Live media, "Try Orus OS": the login screen, with no installer session first. The
# installer is in the launcher once logged in.
[terminal]
vt = 1

[default_session]
command = "sh -c 'test -d /sys/module/virtio_gpu && export WLR_NO_HARDWARE_CURSORS=1; exec labwc -C /usr/share/orus/login -S orus-greeter'"
user = "_greetd"

[package]
name = "orus-textedit"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
name = "orus_textedit"
path = "src/lib.rs"

[[bin]]
name = "orus-textedit"
path = "src/main.rs"

[dependencies]
orus-core = { workspace = true }
anyhow = { workspace = true }
wgpu = { workspace = true }
winit = { workspace = true }
pollster = { workspace = true }
jag-draw = { workspace = true }
jag-surface = { workspace = true }
jag-text = { workspace = true }
rfd = { workspace = true }
pulldown-cmark = "0.12"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }

[features]
